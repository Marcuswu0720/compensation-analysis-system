<title>薪酬人力成本分析工具</title>
<link rel="stylesheet" href="/static/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>

<div class="app-shell">
  <div class="topbar">
    <h1>尼日利亚薪酬人力成本分析工具</h1>
    <div class="who">
      <span id="whoami"></span>
      <button class="secondary" id="logoutBtn" style="margin-left:10px;">退出登录</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="upload">上传数据</button>
    <button class="tab-btn" data-tab="trend">趋势查询</button>
    <button class="tab-btn" data-tab="chat">问答</button>
  </div>

  <!-- 上传 -->
  <div class="tab-panel active" id="tab-upload">
    <div class="card">
      <div class="row">
        <div>
          <label>数据月份</label>
          <input type="month" id="uploadMonth">
        </div>
        <div style="flex:2;">
          <label>原始发薪表 Excel</label>
          <input type="file" id="uploadFile" accept=".xlsx">
        </div>
        <div style="flex:0;">
          <button id="uploadBtn">上传并校验</button>
        </div>
      </div>
      <div class="error" id="uploadError"></div>
    </div>

    <div class="card" id="reviewCard" style="display:none; margin-top:16px;">
      <h3>校验摘要 - <span id="reviewMonth"></span></h3>
      <div class="summary-grid" id="reviewSummary"></div>
      <div id="reviewIssuesWrap">
        <strong>需要注意的问题：</strong>
        <ul class="issue-list" id="reviewIssues"></ul>
      </div>
      <div class="row">
        <button id="confirmBtn">确认无误，正式入库</button>
        <button class="secondary" id="rejectBtn">数据有问题，放弃本次上传</button>
      </div>
      <div class="error" id="reviewError"></div>
    </div>

    <div class="card" style="margin-top:16px;">
      <h3>历史上传记录</h3>
      <div id="uploadHistory"></div>
    </div>
  </div>

  <!-- 趋势查询 -->
  <div class="tab-panel" id="tab-trend">
    <div class="card">
      <div class="row">
        <div>
          <label>部门（不选=全公司）</label>
          <select id="trendDept"><option value="">全部</option></select>
        </div>
        <div>
          <label>实体（不选=全部）</label>
          <select id="trendEntity"><option value="">全部</option></select>
        </div>
        <div>
          <label>起始月份</label>
          <select id="trendStart"></select>
        </div>
        <div>
          <label>结束月份</label>
          <select id="trendEnd"></select>
        </div>
        <div style="flex:0;">
          <button id="trendQueryBtn">查询</button>
        </div>
      </div>
    </div>
    <div class="card" style="margin-top:16px;">
      <canvas id="trendChart" height="90"></canvas>
      <table id="trendTable">
        <thead><tr><th>月份</th><th>在职人数（含当月内离职）</th><th>总HR Cost (₦)</th><th>人均HR Cost (₦)</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="card" style="margin-top:16px;">
      <h3>环比归因</h3>
      <div class="row">
        <div>
          <label>部门（不选=全公司）</label>
          <select id="attrDept"><option value="">全部</option></select>
        </div>
        <div>
          <label>实体（不选=全部）</label>
          <select id="attrEntity"><option value="">全部</option></select>
        </div>
        <div>
          <label>对比月份 A（早）</label>
          <select id="attrPrev"></select>
        </div>
        <div>
          <label>对比月份 B（晚）</label>
          <select id="attrCur"></select>
        </div>
        <div style="flex:0;">
          <button id="attrQueryBtn">归因分析</button>
        </div>
      </div>
      <div id="attrResult" style="margin-top:16px;"></div>
    </div>
  </div>

  <!-- 问答 -->
  <div class="tab-panel" id="tab-chat">
    <div class="card">
      <div class="chat-log" id="chatLog"></div>
      <div class="chat-input-row">
        <textarea id="chatInput" placeholder="例如：手机分期部门1-6月人力成本怎么变化的？"></textarea>
        <button id="chatSendBtn">发送</button>
      </div>
      <div class="muted" style="margin-top:8px;">回答中的每个数字都来自计算层的确定性统计，模型只负责组织语言，不会自己编数字。</div>
    </div>
  </div>
</div>

<script src="/static/js/api.js"></script>
<script src="/static/js/dashboard.js"></script>
