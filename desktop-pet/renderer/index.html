<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>桌宠</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="bubble" class="bubble"></div>

  <div id="pet" class="pet" data-skin="orange" data-state="idle">
    <div class="flip">
      <div class="anim">
        <svg viewBox="0 0 200 200" width="180" height="180">
          <ellipse class="tail" cx="165" cy="150" rx="14" ry="34" transform="rotate(35 165 150)" />
          <ellipse class="ear ear-left" cx="60" cy="55" rx="18" ry="20" />
          <ellipse class="ear ear-right" cx="140" cy="55" rx="18" ry="20" />
          <ellipse class="body" cx="100" cy="115" rx="70" ry="60" />
          <g class="eye eye-left">
            <circle cx="78" cy="105" r="9" />
          </g>
          <g class="eye eye-right">
            <circle cx="122" cy="105" r="9" />
          </g>
          <path class="mouth" d="M 90 130 Q 100 138 110 130" />
          <ellipse class="cheek cheek-left" cx="65" cy="122" rx="8" ry="5" />
          <ellipse class="cheek cheek-right" cx="135" cy="122" rx="8" ry="5" />
        </svg>
      </div>
    </div>
  </div>

  <script src="pet.js"></script>
</body>
</html>
